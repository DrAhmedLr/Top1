name: Release checks
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: blob:none
          persist-credentials: false
      - name: Select checks for the changed files
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          web=false
          mobile=false
          if [[ "$GITHUB_REF" == refs/tags/* ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            web=true
            mobile=true
          else
            git diff --name-only --no-renames -z "$BASE" HEAD -- > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CONTRIBUTING.md|LICENSE|docs/*.md|mobile/README.md) ;;
                mobile/*) mobile=true ;;
                app/api/*|supabase/*|scripts/*|middleware.ts|next.config.mjs|.vercelignore) web=true ;;
                *) web=true; mobile=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "Web release checks: $web. Mobile client checks: $mobile." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.mobile == 'true'
        with:
          node-version: '24'
      - name: Install the project's pnpm version
        id: pnpm
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.mobile == 'true'
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.mobile == 'true'
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.scope.outputs.mobile }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'mobile/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.mobile == 'true'
      - run: pnpm check:release
        if: steps.scope.outputs.web == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.mobile == 'true'
        working-directory: mobile
      - run: pnpm check:client
        if: steps.scope.outputs.mobile == 'true'
        working-directory: mobile
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://top1-ci.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
