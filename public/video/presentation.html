<!doctype html><html lang="en"><meta charset="utf-8"><title>TOP1.FIT · Video studio</title><style>body{margin:0;background:#070f22;color:white;font:15px system-ui}canvas{width:100%;max-height:85vh;object-fit:contain}nav{display:flex;gap:16px;align-items:center;padding:18px}button{padding:12px 20px;border:0;border-radius:6px;cursor:pointer}input{flex:1}</style><canvas id="film" width="1920" height="1080"></canvas><nav><button id="play">Play / pause</button><button id="restart">Restart</button><input id="seek" type="range" min="0" max="30" step=".01" value="0"><span id="time"></span><button id="save">Export video</button></nav><script>
// EDIT THESE VALUES to customize the film. All times are seconds.
const CONFIG={duration:30,title:'A game of human potential.',end:'Discover your next level.',url:'TOP1.FIT',groups:[{name:'Strength',color:'#fb7185',metrics:['Push-ups','Dips','Grip strength','VO₂ max','5 km run','400 m sprint']},{name:'BodyMarkers',color:'#60a5fa',metrics:['Body fat','Waist-to-height ratio','Fasting glucose']},{name:'Recovery',color:'#34d399',metrics:['Sleep duration','Resting heart rate','Heart rate variability']} ]};
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let t=0,playing=false,last=0,recording=false;
const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
function text(s,x,y,size=32,color='#edf5ff',align='left'){c.fillStyle=color;c.font=`${size>=50?700:500} ${size}px Arial`;c.textAlign=align;c.fillText(s,x,y)}
function reveal(start,fn){let a=ease((t-start)/.8);if(!a)return;c.save();c.globalAlpha=a;c.translate(0,30*(1-a));fn();c.restore()}
function draw(){let g=c.createLinearGradient(0,0,1920,1080);g.addColorStop(0,'#09152e');g.addColorStop(1,'#123a69');c.fillStyle=g;c.fillRect(0,0,1920,1080);text('TOP1.FIT',100,90,30);text('HUMAN CAPACITY / BENCHMARK GAME',1820,90,18,'#91afd1','right');
if(t<12){reveal(0,()=>{text(CONFIG.title,100,235,66);text('Measure. Train. Climb.',100,300,30,'#a8c5e5')});const colors=['#f87171','#fb7185','#f59e0b','#fbbf24','#a3e635','#6ee7b7','#34d399','#2dd4bf','#22d3ee','#38bdf8','#60a5fa','#818cf8','#818cf8','#64748b'];for(let i=13;i>=0;i--){reveal(1+(13-i)*.22,()=>{let y=365+i*36,w=32+i*24;c.fillStyle=colors[i];c.beginPath();c.moveTo(960-w,y);c.lineTo(960+w,y);c.lineTo(960+w+19,y+27);c.lineTo(960-w-19,y+27);c.closePath();c.fill()})}reveal(6,()=>{text('Rising → Climbers → Challengers',100,950,28,'#a8c5e5');text('Champions → Elite → GOATs',1820,950,28,'#a8c5e5','right');text('Product-defined challenge tiers',960,1020,19,'#8daacb','center')})}
else if(t<26){reveal(12,()=>{text('Your body. Many capacities.',100,225,64);text('Repeatable measurements. Visible progress.',100,290,28,'#a8c5e5')});CONFIG.groups.forEach((group,j)=>{let x=100+j*590;reveal(12.5+j*.5,()=>{c.fillStyle=group.color;c.fillRect(x,355,510,4);text(group.name,x,420,38,group.color)});group.metrics.forEach((m,i)=>reveal(13.5+j*.5+i*.6,()=>{c.fillStyle='#ffffff0c';c.fillRect(x,465+i*65,510,54);text(m,x+20,501+i*65,25)}))});reveal(22,()=>text('Leave unmeasured metrics blank. Track progress over time.',100,1000,25,'#a8c5e5'))}
else{reveal(26,()=>{text(CONFIG.end,960,450,80,'#edf5ff','center');text(CONFIG.url,960,590,110,'#60a5fa','center');text('Measure your potential. Start your climb.',960,690,32,'#a8c5e5','center')})}document.querySelector('#seek').value=t;document.querySelector('#time').textContent=t.toFixed(1)+' / 30s'}
function tick(now){if(playing){t=Math.min(CONFIG.duration,t+(now-last)/1000);if(t>=CONFIG.duration)playing=false}last=now;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#restart').onclick=()=>{t=0;playing=true};document.querySelector('#seek').oninput=e=>{t=+e.target.value;playing=false};document.querySelector('#save').onclick=()=>{if(recording)return;if(!canvas.captureStream||!window.MediaRecorder){alert('Open in Chrome to export.');return}const mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));const stream=canvas.captureStream(30),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks,{type:mime})),a=document.createElement('a');a.href=url;a.download='top1-fit-presentation.'+(mime.includes('mp4')?'mp4':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);stream.getTracks().forEach(x=>x.stop());recording=false;document.querySelector('#save').textContent='Export video'};t=0;playing=true;recording=true;rec.start();document.querySelector('#save').textContent='Recording… 30 seconds';setTimeout(()=>rec.stop(),CONFIG.duration*1000+100)};
</script></html>
